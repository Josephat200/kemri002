services:
  - type: web
    name: kemri-app
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: API_PREFIX
        value: /api/v1
      - key: SUPABASE_URL
        value: https://qdbkdimgwfyemcgeqicr.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false

# Use the repository root Dockerfile so the backend and frontend are deployed together.
# Set CORS_ORIGIN in Render to the final service URL after the app is created.
